data:
  raw_path: "data/raw/insurance.csv"
  processed_path: "data/processed/insurance_processed.csv"
  test_size: 0.2
  random_state: 42

model:
  name: "xgboost"
  params:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

mlflow:
  experiment_name: "medical-cost-predictor"
  tracking_uri: "mlruns"

db:
  path: "sqlite:///data/predictions.db"
